name: Java CI on Self-Hosted Runner (Build, Deploy, Test)

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: self-hosted
    outputs:
      jar-name: ${{ steps.set-jar.outputs.jar-name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Ensure required applications are installed
        run: |
          set -e
          # Install Java, Maven, Gradle, lsof if missing
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk maven wget unzip lsof

      - name: Build project and set JAR path
        id: set-jar
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:/opt/gradle/gradle-8.4/bin:$PATH

          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
              echo "Detected Gradle project. Building..."
              gradle clean build --no-daemon || exit 1
              JAR_FILE=$(ls build/libs/*.jar | head -n1)
          elif [ -f "pom.xml" ]; then
              echo "Detected Maven project. Building..."
              mvn clean install || exit 1
              JAR_FILE=$(ls target/*.jar | head -n1)
          else
              echo "No recognized build file found."
              exit 1
          fi

          echo "jar-name=$(basename $JAR_FILE)" >> $GITHUB_OUTPUT

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: spring-jar
          path: |
            build/libs/*.jar
            target/*.jar

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download JAR artifact
        uses: actions/download-artifact@v3
        with:
          name: spring-jar
          path: .

      - name: Stop any existing process on port 8084
        run: |
          PORT=8084
          PID=$(lsof -t -i:$PORT || true)
          if [ ! -z "$PID" ]; then
            echo "Stopping process on port $PORT (PID $PID)"
            kill -9 $PID
          fi

      - name: Start Java application and wait until ready
        run: |
          JAR_FILE=$(ls *.jar | head -n1)
          nohup java -jar "$JAR_FILE" --server.port=8084 > app.log 2>&1 &

          echo "Waiting for application to start on port 8084..."
          COUNT=0
          until curl -s http://localhost:8084 > /dev/null; do
              sleep 2
              COUNT=$((COUNT+1))
              if [ $COUNT -ge 30 ]; then
                  echo "Application failed to start within 60s."
                  tail -n 50 app.log
                  exit 1
              fi
          done
          echo "Application started successfully."

  test:
    needs: deploy
    runs-on: self-hosted
    steps:
      - name: Verify application is running
        run: curl -f http://localhost:8084 || exit 1

      - name: Show last 20 log lines
        run: tail -n 20 app.log
