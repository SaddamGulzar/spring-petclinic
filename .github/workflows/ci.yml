name: Java CI on Self-Hosted Runner (Build, Deploy, Test)

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: self-hosted
    outputs:
      jar-path: ${{ steps.set-jar.outputs.jar-path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Ensure required applications are installed
        run: |
          set -e
          wait_for_apt() {
            while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
              echo "Waiting for other apt/dpkg processes to finish..."
              sleep 3
            done
          }
          wait_for_apt
          sudo apt-get update

          # Java 21
          if ! command -v java &> /dev/null || ! java -version 2>&1 | grep -q "21"; then
            echo "Installing OpenJDK 21..."
            wait_for_apt
            sudo apt-get install -y openjdk-21-jdk
          fi

          # Maven
          if ! command -v mvn &> /dev/null; then
            wait_for_apt
            sudo apt-get install -y maven
          fi

          # wget, unzip, lsof
          if ! command -v wget &> /dev/null; then
            wait_for_apt
            sudo apt-get install -y wget unzip lsof
          fi

      - name: Ensure Gradle 8.4 is available temporarily
        run: |
          export GRADLE_DIR=/opt/gradle/gradle-8.4
          export PATH=$GRADLE_DIR/bin:$PATH

          if [ ! -d "$GRADLE_DIR" ]; then
            echo "Installing Gradle 8.4 temporarily..."
            sudo mkdir -p /opt/gradle
            wget https://services.gradle.org/distributions/gradle-8.4-bin.zip -P /tmp
            sudo unzip -o /tmp/gradle-8.4-bin.zip -d /opt/gradle
            rm /tmp/gradle-8.4-bin.zip
          fi
          gradle -v

      - name: Build project and set JAR path
        id: set-jar
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH=$JAVA_HOME/bin:/opt/gradle/gradle-8.4/bin:$PATH

          java -version
          gradle -v || true
          mvn -v || true

          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
              echo "Detected Gradle project. Building..."
              gradle clean build --no-daemon || exit 1
              JAR_FILE=$(ls build/libs/*.jar | head -n1)
          elif [ -f "pom.xml" ]; then
              echo "Detected Maven project. Building..."
              mvn clean install || exit 1
              JAR_FILE=$(ls target/*.jar | head -n1)
          else
              echo "No recognized build file found."
              exit 1
          fi

          echo "jar-path=$(pwd)/$JAR_FILE" >> $GITHUB_OUTPUT

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-jar
          path: ${{ steps.set-jar.outputs.jar-path }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-jar
          path: .

      - name: Stop any existing process on port 8084
        run: |
          PORT=8084
          PID=$(lsof -t -i:$PORT || true)
          if [ ! -z "$PID" ]; then
            echo "Stopping process on port $PORT (PID $PID)"
            kill -9 $PID
          fi

      - name: Start Java application and wait until ready
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH=$JAVA_HOME/bin:/opt/gradle/gradle-8.4/bin:$PATH

          JAR_FILE=$(ls *.jar | head -n1)
          echo "Starting JAR: $JAR_FILE"
          nohup java -jar "$JAR_FILE" --server.port=8084 > app.log 2>&1 &

          echo "Listing running Java processes:"
          ps -ef | grep java

          echo "Waiting for application to start on port 8084..."
          COUNT=0
          until curl -s http://localhost:8084/actuator/health > /dev/null; do
              sleep 2
              COUNT=$((COUNT+1))
              if [ $COUNT -ge 60 ]; then
                  echo "Application failed to start within 120s."
                  tail -n 50 app.log
                  exit 1
              fi
          done
          echo "Application started successfully."

  test:
    needs: deploy
    runs-on: self-hosted
    steps:
      - name: Verify application health
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH=$JAVA_HOME/bin:/opt/gradle/gradle-8.4/bin:$PATH

          echo "Checking application health..."
          if ! curl -f http://localhost:8084/actuator/health; then
            echo "Application is not healthy!"
            tail -n 50 app.log
            exit 1
          fi

      - name: Show last 20 log lines
        run: tail -n 20 app.log
