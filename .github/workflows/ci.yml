name: Java CI on Self-Hosted Runner (Build, Deploy, Test)

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: self-hosted
    outputs:
      jar-path: ${{ steps.set-jar.outputs.jar-path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Ensure required applications are installed
        run: |
          #!/bin/bash
          set -e

          wait_for_apt() {
            while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
              echo "Waiting for other apt/dpkg processes to finish..."
              sleep 3
            done
          }

          # Java
          if ! command -v java &> /dev/null; then
            wait_for_apt
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk
          fi

          # Maven
          if ! command -v mvn &> /dev/null; then
            wait_for_apt
            sudo apt-get install -y maven
          fi

          # Gradle
          if ! command -v gradle &> /dev/null; then
            wait_for_apt
            sudo apt-get install -y wget unzip
            sudo rm -rf /opt/gradle/gradle-8.4
            wget https://services.gradle.org/distributions/gradle-8.4-bin.zip -P /tmp
            sudo unzip -o /tmp/gradle-8.4-bin.zip -d /opt/gradle
            rm /tmp/gradle-8.4-bin.zip
          fi

          # lsof
          if ! command -v lsof &> /dev/null; then
            wait_for_apt
            sudo apt-get install -y lsof
          fi

      - name: Build project and set JAR path
        id: set-jar
        env:
          PATH: /opt/gradle/gradle-8.4/bin:${{ env.PATH }}
        run: |
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
              echo "Detected Gradle project. Building with refresh dependencies..."
              gradle clean build --no-daemon --refresh-dependencies || {
                  echo "Gradle build failed. Check plugin repositories in build.gradle"
                  exit 1
              }
              echo "jar-path=build/libs/$(ls build/libs/*.jar | head -n1 | xargs -n1 basename)" >> $GITHUB_OUTPUT
          elif [ -f "pom.xml" ]; then
              echo "Detected Maven project. Building..."
              mvn clean install || {
                  echo "Maven build failed."
                  exit 1
              }
              echo "jar-path=target/$(ls target/*.jar | head -n1 | xargs -n1 basename)" >> $GITHUB_OUTPUT
          else
              echo "No recognized build file found. Exiting."
              exit 1
          fi

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Stop any existing process on port 8084
        run: |
          PORT=8084
          PID=$(lsof -t -i:$PORT || true)
          if [ ! -z "$PID" ]; then
            echo "Stopping process on port $PORT (PID $PID)"
            kill -9 $PID
          fi

      - name: Wait until port 8084 is free
        run: |
          PORT=8084
          COUNT=0
          while lsof -i:$PORT > /dev/null; do
            echo "Port $PORT still in use. Waiting..."
            sleep 2
            COUNT=$((COUNT+1))
            if [ $COUNT -ge 10 ]; then
              echo "Port $PORT still busy after 20s. Exiting."
              exit 1
            fi
          done

      - name: Start Java application
        run: |
          JAR_FILE=${{ needs.build.outputs.jar-path }}
          nohup java -jar "$JAR_FILE" --server.port=8084 > app.log 2>&1 &
          sleep 5
          echo "Application started on port 8084"

  test:
    needs: deploy
    runs-on: self-hosted
    steps:
      - name: Verify application is running
        run: curl -f http://localhost:8084 || exit 1

      - name: Show last 20 log lines
        run: tail -n 20 app.log
